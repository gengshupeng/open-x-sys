<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1225" viewBox="0 0 1600 1225" role="img" class="panoramic-svg" aria-labelledby="panorama-export-title panorama-export-desc"><title id="panorama-export-title">OpenXSys · 以自然语言为核心的系统之系统</title><desc id="panorama-export-desc">运行回路用系统改变工作结果。建造回路改变系统本身可以做什么。各参与方仍然保有自己的边界。</desc><defs><marker id="panorama-export-authority" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9b4937"/></marker><marker id="panorama-export-knowledge" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#325d92"/></marker><marker id="panorama-export-action" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a6f4c"/></marker><marker id="panorama-export-state" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#76578e"/></marker><marker id="panorama-export-build" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#986212"/></marker><marker id="panorama-export-neutral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536859"/></marker><style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1a2e24}
      .mapTitle{font-size:33px;font-weight:750}
      .mapSub,.caption{font-size:16px;fill:#4b6555}
      .groupTitle{font-size:19px;font-weight:750;fill:#304f3f}
      .boxTitle{font-size:21px;font-weight:750}
      .boxBody{font-size:16px;fill:#3e5b4a}
      .edgeText{font-size:15px;font-weight:650}
      .status{font-size:13px;font-weight:750}
    </style></defs><rect width="100%" height="100%" fill="#f4f5e9"/><text x="38" y="54" class="mapTitle" text-anchor="start" >OpenXSys · 以自然语言为核心的系统之系统</text><text x="40" y="85" class="mapSub" text-anchor="start" >运行回路用系统改变工作结果。建造回路改变系统本身可以做什么。各参与方仍然保有自己的边界。</text><rect x="392" y="116" width="786" height="914" rx="8" fill="#e1ebd9" stroke="#9eb4a0" stroke-dasharray="7 5"/><text x="410" y="143" class="groupTitle" text-anchor="start" >一个由人掌握、能按处境生长的 OpenXSys 系统</text><rect x="414" y="164" width="740" height="112" rx="8" fill="#e1efcc" stroke="#8fad86"/><text x="428" y="193" class="boxTitle" text-anchor="start" >自然语言核心 · 可修改的系统设计</text><text x="428" y="219" class="boxBody" text-anchor="start" >目的、对象模型、成功标准  ·  分工和授权  ·  条件变化时如何复核</text><text x="428" y="242" class="boxBody" text-anchor="start" >人定义并修正关键约定。模型理解这些约定，组织实际工作。</text><rect x="414" y="335" width="334" height="142" rx="8" fill="#ebf0f8" stroke="#a3b9d1"/><text x="428" y="364" class="boxTitle" text-anchor="start" >理解对象与鸿沟</text><text x="428" y="390" class="boxBody" text-anchor="start" >观察各方的状态、边界和约束</text><text x="428" y="413" class="boxBody" text-anchor="start" >判断当前缺少观察、翻译、行动</text><text x="428" y="436" class="boxBody" text-anchor="start" >还是协调所需的能力</text><rect x="811" y="335" width="343" height="142" rx="8" fill="#f7f5e8" stroke="#a7ad88" stroke-dasharray="7 5"/><text x="825" y="364" class="boxTitle" text-anchor="start" >建造所缺的关系</text><text x="825" y="390" class="boxBody" text-anchor="start" >选择、适配或生成候选实现</text><text x="825" y="413" class="boxBody" text-anchor="start" >让候选接受样本、反例和权限检查</text><text x="825" y="436" class="boxBody" text-anchor="start" >将合适的实现接到工作上</text><rect x="414" y="548" width="740" height="126" rx="8" fill="#e4f0e2" stroke="#a6c2a6"/><text x="428" y="577" class="boxTitle" text-anchor="start" >已经形成的具体能力 · 在现场使用</text><text x="428" y="603" class="boxBody" text-anchor="start" >代码、数据转换、生态接口、交互界面、模拟，或新的人工分工</text><text x="428" y="626" class="boxBody" text-anchor="start" >每项能力有用途、输入输出、适用条件、验收记录及当前授权</text><rect x="414" y="744" width="740" height="130" rx="8" fill="#f0e9f4" stroke="#c5b0ce"/><text x="428" y="773" class="boxTitle" text-anchor="start" >使用者拥有的状态与演化记录</text><text x="428" y="799" class="boxBody" text-anchor="start" >保留对象认识、执行结果、所用能力、验证、版本和依赖</text><text x="428" y="822" class="boxBody" text-anchor="start" >条件变化时，能定位哪些认识、产物和做法要重审、替换或重新生成</text><rect x="414" y="944" width="740" height="68" rx="8" fill="#f7f5e8" stroke="#a7ad88" stroke-dasharray="7 5"/><text x="428" y="973" class="boxTitle" text-anchor="start" >跨系统组合 · 共享有边界的能力、成果或子系统</text><text x="428" y="999" class="boxBody" text-anchor="start" >约定用途、依赖、验证与撤回方式，接收方可以按本地处境改造</text><rect x="38" y="181" width="300" height="174" rx="8" fill="#f9ece4" stroke="#cda99b"/><text x="52" y="210" class="boxTitle" text-anchor="start" >人 · 目的与决定</text><text x="52" y="236" class="boxBody" text-anchor="start" >提出目标、取舍和边界</text><text x="52" y="259" class="boxBody" text-anchor="start" >授予行动所需的范围</text><text x="52" y="282" class="boxBody" text-anchor="start" >审阅重要结果与系统变化</text><text x="52" y="305" class="boxBody" text-anchor="start" >也可直接观察、参与和行动</text><rect x="38" y="481" width="300" height="153" rx="8" fill="#fffef6" stroke="#bacdbb"/><text x="52" y="510" class="boxTitle" text-anchor="start" >真实工作交付</text><text x="52" y="536" class="boxBody" text-anchor="start" >解释、作品、决定或能力</text><text x="52" y="559" class="boxBody" text-anchor="start" >来自实际工作与检验</text><text x="52" y="582" class="boxBody" text-anchor="start" >接收使用结果和人的纠正</text><rect x="38" y="897" width="300" height="154" rx="8" fill="#f7f5e8" stroke="#a7ad88" stroke-dasharray="7 5"/><text x="52" y="926" class="boxTitle" text-anchor="start" >另一方的工作系统</text><text x="52" y="952" class="boxBody" text-anchor="start" >独立维护状态与规则</text><text x="52" y="975" class="boxBody" text-anchor="start" >可接手、适配、替换或撤回</text><text x="52" y="998" class="boxBody" text-anchor="start" >形成新的更大系统</text><rect x="1252" y="163" width="310" height="170" rx="8" fill="#ebf0f8" stroke="#a3b9d1"/><text x="1266" y="192" class="boxTitle" text-anchor="start" >AI · 理解、推演和生成</text><text x="1266" y="218" class="boxBody" text-anchor="start" >用可见材料和约定研究对象</text><text x="1266" y="241" class="boxBody" text-anchor="start" >提出实现、测试与替代方案</text><text x="1266" y="264" class="boxBody" text-anchor="start" >现实异常时重新判断</text><rect x="1252" y="467" width="310" height="204" rx="8" fill="#e4f0e2" stroke="#a6c2a6"/><text x="1266" y="496" class="boxTitle" text-anchor="start" >电脑 · 载入、检验和执行</text><text x="1266" y="522" class="boxBody" text-anchor="start" >宿主检查权限和资源</text><text x="1266" y="545" class="boxBody" text-anchor="start" >试跑候选实现，检查条件</text><text x="1266" y="568" class="boxBody" text-anchor="start" >执行已启用的动作</text><text x="1266" y="591" class="boxBody" text-anchor="start" >返回回执、错误和观察结果</text><rect x="1252" y="798" width="310" height="201" rx="8" fill="#f7f5e8" stroke="#a7ad88" stroke-dasharray="7 5"/><text x="1266" y="827" class="boxTitle" text-anchor="start" >对象 X · 独立演化的系统</text><text x="1266" y="853" class="boxBody" text-anchor="start" >组成、状态、反馈与约束</text><text x="1266" y="876" class="boxBody" text-anchor="start" >通过材料、接口或人被观察</text><text x="1266" y="899" class="boxBody" text-anchor="start" >通过获准动作受到影响</text><text x="1266" y="922" class="boxBody" text-anchor="start" >变化经观察再次进入系统</text><g class="wire" data-wire="authority" opacity="1"><path d="M338 225H412" fill="none" stroke="#9b4937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-authority)"/><text x="375" y="212" class="edgeText" text-anchor="middle" style="fill:#9b4937" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">目标与授权</text></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M1154 214H1250" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-knowledge)"/><text x="1202" y="200" class="edgeText" text-anchor="middle" style="fill:#325d92" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">约定与材料</text></g><g class="wire" data-wire="build" opacity="1"><path d="M1252 291H1203V394H1156" fill="none" stroke="#986212" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-build)"/><text x="1198" y="351" class="edgeText" text-anchor="middle" style="fill:#986212" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">候选实现</text></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M1203 300H994" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M976 300H723V333" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-knowledge)"/><text x="844" y="292" class="edgeText" text-anchor="middle" style="fill:#325d92" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">解释与待核问题</text></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M591 276V333" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-knowledge)"/><text x="602" y="314" class="edgeText" text-anchor="start" style="fill:#325d92" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">带着目的理解</text></g><g class="wire" data-wire="authority" opacity="1"><path d="M985 276V333" fill="none" stroke="#9b4937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-authority)"/><text x="997" y="324" class="edgeText" text-anchor="start" style="fill:#9b4937" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">在边界内建造</text></g><g class="wire" data-wire="build" opacity="1"><path d="M748 403H809" fill="none" stroke="#986212" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-build)"/></g><g class="wire" data-wire="build" opacity="1"><path d="M975 477V546" fill="none" stroke="#986212" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-build)"/><text x="987" y="522" class="edgeText" text-anchor="start" style="fill:#986212" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">验收并启用</text></g><g class="wire" data-wire="build" opacity="1"><path d="M1154 451H1178V514H1250" fill="none" stroke="#986212" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#panorama-export-build)" marker-end="url(#panorama-export-build)"/><text x="1215" y="501" class="edgeText" text-anchor="middle" style="fill:#986212" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">试验与验收</text></g><g class="wire" data-wire="action" opacity="1"><path d="M1154 582H1250" fill="none" stroke="#3a6f4c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-action)"/><text x="1202" y="568" class="edgeText" text-anchor="middle" style="fill:#3a6f4c" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">受限执行</text></g><g class="wire" data-wire="state" opacity="1"><path d="M1252 627H1199V790H1156" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-state)"/><text x="1199" y="614" class="edgeText" text-anchor="middle" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">观察与回执</text></g><g class="wire" data-wire="action" opacity="1"><path d="M1330 671V796" fill="none" stroke="#3a6f4c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-action)"/><text x="1342" y="730" class="edgeText" text-anchor="start" style="fill:#3a6f4c" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">获准动作</text></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M1492 798V673" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-knowledge)"/><text x="1480" y="758" class="edgeText" text-anchor="end" style="fill:#325d92" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">经来源观察</text></g><g class="wire" data-wire="state" opacity="1"><path d="M590 674V742" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-state)"/><text x="601" y="712" class="edgeText" text-anchor="start" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">记录效果和用法</text></g><g class="wire" data-wire="state" opacity="1"><path d="M994 744V676" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-state)"/><text x="1006" y="712" class="edgeText" text-anchor="start" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">读回已验能力</text></g><g class="wire" data-wire="build" opacity="1"><path d="M414 809H374V449H412" fill="none" stroke="#986212" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-build)"/><text x="370" y="767" class="edgeText" text-anchor="end" style="fill:#986212" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">发现失效后再建造</text></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M414 602H383" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M365 602H353V541H340" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-knowledge)"/><text x="353" y="582" class="edgeText" text-anchor="middle" style="fill:#325d92" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">交付</text></g><g class="wire" data-wire="state" opacity="1"><path d="M190 481V357" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-state)"/><text x="202" y="431" class="edgeText" text-anchor="start" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">进入人的判断</text></g><g class="wire" data-wire="state" opacity="1"><path d="M338 628H356V834H412" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-state)"/><text x="351" y="727" class="edgeText" text-anchor="end" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">使用反馈</text></g><g class="wire" data-wire="state" opacity="1"><path d="M785 874V942" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#panorama-export-state)"/><text x="800" y="917" class="edgeText" text-anchor="start" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">选取相应成果或能力</text></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M414 968H340" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#panorama-export-knowledge)"/><text x="376" y="953" class="edgeText" text-anchor="middle" style="fill:#325d92" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">许可交接</text></g><g class="wire" data-wire="state" opacity="1"><path d="M338 998H412" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#panorama-export-state)"/><text x="375" y="987" class="edgeText" text-anchor="middle" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">经验回流</text></g><g class="wire" data-wire="neutral" opacity="1"><path d="M38 304H19V1084H1228V960H1250" fill="none" stroke="#536859" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-start="url(#panorama-export-neutral)" marker-end="url(#panorama-export-neutral)"/><text x="789" y="1074" class="edgeText" text-anchor="middle" style="fill:#536859" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">人也能直接观察、协商和行动</text></g><g class="wire" data-wire="neutral" opacity="1"><path d="M1410 467V335" fill="none" stroke="#536859" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#panorama-export-neutral)"/><text x="1420" y="401" class="edgeText" text-anchor="start" style="fill:#536859" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">承载或接入模型</text></g><rect x="38" y="1110" width="1524" height="66" rx="8" fill="#e8eee2" stroke="#9eb49d"/><text x="57" y="1149" class="groupTitle" text-anchor="start" >终极目标：让人能够建造、使用并演化跨系统的关系，已有系统可以再成为下一层系统的部件。</text><text x="1527" y="1149" class="caption" text-anchor="end" >未来目标架构</text><g class="wire" data-wire="authority" opacity="1"><path d="M40 1200H59" fill="none" stroke="#9b4937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="67" y="1205" class="edgeText" text-anchor="start" style="fill:#9b4937" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">意图与决定权</text></g><g class="wire" data-wire="knowledge" opacity="1"><path d="M284 1200H303" fill="none" stroke="#325d92" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="311" y="1205" class="edgeText" text-anchor="start" style="fill:#325d92" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">观察、认识与证据</text></g><g class="wire" data-wire="action" opacity="1"><path d="M528 1200H547" fill="none" stroke="#3a6f4c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="555" y="1205" class="edgeText" text-anchor="start" style="fill:#3a6f4c" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">动作与执行</text></g><g class="wire" data-wire="state" opacity="1"><path d="M772 1200H791" fill="none" stroke="#76578e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="799" y="1205" class="edgeText" text-anchor="start" style="fill:#76578e" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">持续状态与反馈</text></g><g class="wire" data-wire="build" opacity="1"><path d="M1016 1200H1035" fill="none" stroke="#986212" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1043" y="1205" class="edgeText" text-anchor="start" style="fill:#986212" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">提出、验收与再建造</text></g><g class="wire" data-wire="neutral" opacity="1"><path d="M1260 1200H1279" fill="none" stroke="#536859" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="1287" y="1205" class="edgeText" text-anchor="start" style="fill:#536859" paint-order="stroke fill" stroke="#f4f5e9" stroke-width="5" stroke-linejoin="round">直接联系与部署</text></g></svg>